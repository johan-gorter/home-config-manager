# /etc/wireguard/wg0.conf on the VPS. Keep net.ipv4.ip_forward = 0: the VPS
# only talks to the home server, it never routes into the home network.
[Interface]
Address = 10.77.0.1/24
ListenPort = 51820
PrivateKey = <contents of /etc/wireguard/vps.key>

[Peer]
PublicKey = <home server public key>
AllowedIPs = 10.77.0.2/32
