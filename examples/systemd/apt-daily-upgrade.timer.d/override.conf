# /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
# Install updates at 03:00, before the automatic reboot at 03:30
# (Unattended-Upgrade::Automatic-Reboot-Time). An update that needs a
# reboot is then finished the same night instead of the night after.
[Timer]
OnCalendar=
OnCalendar=*-*-* 03:00
RandomizedDelaySec=10m
