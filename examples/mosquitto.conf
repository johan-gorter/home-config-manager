# /srv/homeassistant/mosquitto/config/mosquitto.conf
# Anonymous access is acceptable ONLY because the port is published on
# 127.0.0.1 (see docker-compose.yml). Zigbee2MQTT reaches it over the Docker
# network, Home Assistant (host network) over localhost.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
